<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uncle Adam's Game Emporium</title>
    <meta
      name="description"
      content="Step inside Uncle Adam's Game Emporium — an old-timey shop full of playable games."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Luckiest+Guy&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="street-glow" aria-hidden="true"></div>

    <header class="storefront">
      <div class="awning" aria-hidden="true">
        <div class="awning-stripe"></div>
        <div class="awning-stripe"></div>
        <div class="awning-stripe"></div>
        <div class="awning-stripe"></div>
        <div class="awning-stripe"></div>
        <div class="awning-stripe"></div>
        <div class="awning-stripe"></div>
        <div class="awning-stripe"></div>
      </div>

      <div class="sign-frame">
        <div class="sign-chains" aria-hidden="true">
          <span></span>
          <span></span>
        </div>
        <h1 class="store-sign">
          <span class="sign-line">Uncle Adam's</span>
          <span class="sign-line sign-line-emporium">Game Emporium</span>
        </h1>
        <p class="tagline">Fine games for curious minds since forever</p>
      </div>
    </header>

    <main id="shelves" class="shelves">
      <div class="shelf-header">
        <h2>On the shelves today</h2>
        <p>Pick a game and step through the door.</p>
      </div>

      <ul class="game-shelf">
        <li>
          <a
            class="game-plaque"
            href="https://jackson24601.github.io/medieval/"
          >
            <span class="plaque-title">Humans v. Goblins</span>
            <span class="plaque-meta">Medieval battle</span>
          </a>
        </li>
        <li>
          <a
            class="game-plaque"
            href="https://jackson24601.github.io/spacequest/"
          >
            <span class="plaque-title">Space Quest</span>
            <span class="plaque-meta">Space adventure</span>
          </a>
        </li>
      </ul>
    </main>

    <footer class="shop-footer">
      <p>Uncle Adam's Game Emporium &middot; Open whenever curiosity strikes</p>
    </footer>
  </body>
</html>
